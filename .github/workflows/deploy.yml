---
  name: "generate-release"

  # only version tags publish a release: another tag pushed by mistake, or one recreated on
  # an old commit, does not run it. workflow_dispatch builds the assets without publishing.
  on:
    push:
      tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    workflow_dispatch:

  jobs:
    build:
      runs-on: ${{ matrix.operating-system }}
      strategy:
        matrix:
          operating-system: [ubuntu-latest, windows-latest]
      steps:
      - uses: actions/checkout@v4

      - name: Setup FPC and Lazarus
        uses: ./.github/actions/setup-toolchain

      - name: Setup boss
        uses: ./.github/actions/setup-boss

      - name: BOSS Update packages
        run: boss update

      - name: Creating output folders
        run: |
          mkdir assets

      - name: Building (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          echo "building main application..."
          lazbuild --lazarusdir="$LAZARUS_DIR" "apps/pasc/pasc.lpi" -B --build-mode=Release
          # -j keeps the executable at the root of the zip, as mise expects
          zip -j ./assets/pasc-linux-amd64.zip ./apps/pasc/pasc

      - name: Building (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: |
          echo "building main application..."
          lazbuild --lazarusdir="$env:LAZARUS_DIR" "apps/pasc/pasc.lpi" -B --build-mode=Release --os=win64 --cpu=x86_64
          Compress-Archive ./apps/pasc/pasc.exe ./assets/pasc-windows-amd64.zip

      # artifacts are immutable since v4, so each OS uploads its own and the release merges them
      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.operating-system }}
          path: assets/

    generate-release:
      name: "Generate release"
      if: ${{ startsWith(github.ref, 'refs/tags/v') }}
      runs-on: "ubuntu-latest"
      needs: build
      permissions:
        contents: write

      steps:
        - uses: actions/download-artifact@v4.1.7
          with:
            pattern: assets-*
            merge-multiple: true
            path: assets/

        # sha256sum format, so a manual install can check the zip with sha256sum -c --ignore-missing;
        # a fixed name, so releases/latest/download/pasc_checksums.txt always works
        - name: Checksums
          run: |
            cd assets
            sha256sum *.zip > pasc_checksums.txt
            cat pasc_checksums.txt

        - uses: ncipollo/release-action@v1
          with:
            artifacts: "assets/*.zip,assets/pasc_checksums.txt"
            generateReleaseNotes: true
