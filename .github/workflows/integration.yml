name: build

# Pull requests, and the push to main after a merge, so the build badge of the README shows
# the state of main. The release workflow builds again on the tag. The FPC and Lazarus cache
# of main, which pull requests can restore, is kept by toolchain-cache.yml.
on:
  push:
    branches:
    - "main"
    paths-ignore: &ignored-paths
    - "README.md"
    - "LICENSE"
    - "docs/**"
    - ".vscode/**"
    - "releases.ps1"
    - "pasc.json"
    - ".github/workflows/deploy.yml"
    - ".github/workflows/toolchain-cache.yml"
    - ".github/workflows/docs.yml"
  pull_request:
    paths-ignore: *ignored-paths
    branches:
    - "main"
  workflow_dispatch:

permissions:
  contents: read

# a new push to the pull request, or a new merge, cancels the build of the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4

    - name: Setup FPC and Lazarus
      uses: ./.github/actions/setup-toolchain

    - name: Setup boss
      uses: ./.github/actions/setup-boss

    - name: BOSS Update packages
      run: boss update

    # FPC on Windows is i386 with a cross compiler, so the 64-bit target is explicit,
    # as in the release
    - name: Building main application
      shell: bash
      run: |
        target=""
        if [ "$RUNNER_OS" = "Windows" ]; then target="--os=win64 --cpu=x86_64"; fi
        lazbuild --lazarusdir="$LAZARUS_DIR" $target "apps/pasc/pasc.lpi" -B --build-mode=Release

    - name: Building unit test application
      shell: bash
      run: |
        target=""
        if [ "$RUNNER_OS" = "Windows" ]; then target="--os=win64 --cpu=x86_64"; fi
        lazbuild --lazarusdir="$LAZARUS_DIR" $target "apps/pasc/tests/TestPasc.lpi" -B

    - name: Run the unit test application
      run: apps/pasc/tests/TestPasc "--all" "--format=plain"

    # an app created from each template must pass pasc check, build and pass its tests,
    # with the dependencies installed by pasc new
    - name: Testing the app templates
      shell: bash
      run: |
        pasc="$GITHUB_WORKSPACE/apps/pasc/pasc"
        cd "$RUNNER_TEMP"
        for template in cli web; do
          "$pasc" new "${template}app" --template=$template
          (cd "${template}app" && "$pasc" check && "$pasc" build && "$pasc" test)
        done

  # pasc coverage on pasc itself, on Ubuntu only: kcov does not run on Windows. On main the
  # total goes to coverage.json in the badges branch, read by the coverage badge of the README
  # through the shields.io endpoint, so the README never changes to update it.
  coverage:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      KCOV_VERSION: "43"
      # https://github.com/SimonKagstrom/kcov/archive/refs/tags/v43.tar.gz, the same sha256
      # as the Homebrew formula, and the same sha512 as the Arch Linux package
      KCOV_SHA256: 4cbba86af11f72de0c7514e09d59c7927ed25df7cebdad087f6d3623213b95bf
    steps:
    - uses: actions/checkout@v4

    - name: Setup FPC and Lazarus
      uses: ./.github/actions/setup-toolchain

    - name: Setup boss
      uses: ./.github/actions/setup-boss

    - name: BOSS Update packages
      run: boss update

    # Ubuntu 24.04 has no kcov package, so it is built from the sources of the release tag
    - name: Cache kcov
      id: kcov-cache
      uses: actions/cache@v4
      with:
        path: ~/kcov
        key: kcov-${{ env.KCOV_VERSION }}-${{ runner.os }}-${{ env.ImageOS }}

    - name: Install kcov
      run: |
        if [ "${{ steps.kcov-cache.outputs.cache-hit }}" = "true" ]; then
          sudo apt-get install -y -qq --no-install-recommends libdw1t64 libelf1t64 libcurl4t64
        else
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake binutils-dev libssl-dev \
            libcurl4-openssl-dev libelf-dev zlib1g-dev libdw-dev libiberty-dev
          cd "$RUNNER_TEMP"
          curl -fsSL -o kcov.tar.gz "https://github.com/SimonKagstrom/kcov/archive/refs/tags/v$KCOV_VERSION.tar.gz"
          echo "$KCOV_SHA256  kcov.tar.gz" | sha256sum -c -
          tar xzf kcov.tar.gz
          cmake -S "kcov-$KCOV_VERSION" -B kcov-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/kcov"
          cmake --build kcov-build -j"$(nproc)"
          cmake --install kcov-build
        fi
        echo "$HOME/kcov/bin" >> "$GITHUB_PATH"
        "$HOME/kcov/bin/kcov" --version

    - name: Building main application
      run: lazbuild --lazarusdir="$LAZARUS_DIR" "apps/pasc/pasc.lpi"

    # at the root of the workspace, every member with tests, merged in coverage/kcov-merged
    - name: Measuring the coverage
      run: apps/pasc/pasc coverage

    - name: Upload the coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage/
        retention-days: 14

    # the same color bands as the other projects: red below 60%, yellow below 80%, green
    # below 90%, then brightgreen. A push with GITHUB_TOKEN starts no workflow, so no loop.
    - name: Publish the coverage badge
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        percent=$(jq -r '.percent_covered' coverage/kcov-merged/coverage.json)
        color=$(awk -v p="$percent" 'BEGIN { if (p < 60) print "red"; else if (p < 80) print "yellow"; else if (p < 90) print "green"; else print "brightgreen" }')
        message=$(awk -v p="$percent" 'BEGIN { printf "%.1f%%", p }')

        badges="$RUNNER_TEMP/badges"
        if git fetch --depth=1 origin badges:refs/remotes/origin/badges; then
          git worktree add -B badges "$badges" origin/badges
        else
          git worktree add --orphan -b badges "$badges"
        fi
        jq -n --arg message "$message" --arg color "$color" \
          '{schemaVersion: 1, label: "coverage", message: $message, color: $color}' > "$badges/coverage.json"

        cd "$badges"
        git add coverage.json
        if git diff --cached --quiet; then
          echo "coverage unchanged: $message"
          exit 0
        fi
        git -c user.name="github-actions[bot]" \
          -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
          commit -q -m "coverage $message ($GITHUB_SHA)"
        git push origin badges
