name: build

# Pull requests only: the merge into main would rebuild what the pull request already
# tested, and the release workflow builds again on the tag. The FPC and Lazarus cache of
# main, which pull requests can restore, is kept by toolchain-cache.yml.
on:
  pull_request:
    paths-ignore:
    - "README.md"
    - "LICENSE"
    - "docs/**"
    - ".vscode/**"
    - "releases.ps1"
    - "pasc.json"
    - ".github/workflows/deploy.yml"
    - ".github/workflows/toolchain-cache.yml"
    branches:
    - "main"
  workflow_dispatch:

# a new push to the pull request cancels the build of the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4

    - name: Setup FPC and Lazarus
      uses: ./.github/actions/setup-toolchain

    - name: Setup boss
      uses: ./.github/actions/setup-boss

    - name: BOSS Update packages
      run: boss update

    # FPC on Windows is i386 with a cross compiler, so the 64-bit target is explicit,
    # as in the release
    - name: Building main application
      shell: bash
      run: |
        target=""
        if [ "$RUNNER_OS" = "Windows" ]; then target="--os=win64 --cpu=x86_64"; fi
        lazbuild --lazarusdir="$LAZARUS_DIR" $target "apps/pasc/pasc.lpi" -B --build-mode=Release

    - name: Building unit test application
      shell: bash
      run: |
        target=""
        if [ "$RUNNER_OS" = "Windows" ]; then target="--os=win64 --cpu=x86_64"; fi
        lazbuild --lazarusdir="$LAZARUS_DIR" $target "apps/pasc/tests/TestPasc.lpi" -B

    - name: Run the unit test application
      run: apps/pasc/tests/TestPasc "--all" "--format=plain"
