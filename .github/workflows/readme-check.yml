name: readme windows install check

# Temporary, for #22: runs the PowerShell manual install from the README on Windows. No
# release has pasc_checksums.txt yet, so it is written in the release format (sha256sum)
# with the hash of the latest Windows zip (v1.2.1) instead of downloaded.
on:
  pull_request:
    branches:
    - "main"

jobs:
  check:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run the README snippet
      run: |
        $readme = Get-Content README.md -Raw
        $snippet = [regex]::Match($readme, '(?s)```powershell\r?\n(.*?)```').Groups[1].Value
        if (-not $snippet) { throw "PowerShell snippet not found in README.md" }
        $snippet = ($snippet -split "\r?\n" | Where-Object { $_ -notmatch 'pasc_checksums.txt" -OutFile' }) -join "`n"
        Set-Content pasc_checksums.txt "40ad243e9145bd04ae64ab0e90396e18241ec8fc95169510ceef5bc53d16e5e4  pasc-windows-amd64.zip"
        Write-Host "--- snippet"; Write-Host $snippet
        Invoke-Expression $snippet
        & "$env:LOCALAPPDATA\Programs\pasc\pasc.exe" version

    - name: A tampered zip is rejected
      run: |
        Add-Content pasc-windows-amd64.zip "x"
        $expected = (Select-String "pasc-windows-amd64.zip" pasc_checksums.txt).Line.Split(" ")[0]
        if ((Get-FileHash pasc-windows-amd64.zip -Algorithm SHA256).Hash -ne $expected) { Write-Host "rejected, as expected" } else { throw "tampered zip accepted" }
